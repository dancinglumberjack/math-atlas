name: Something is broken
description: Report an interaction, display, calculator, or loading problem.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Math Atlas. This report will be public. Use sample data and remove student names, school/class details, diagnoses, grades, and identifying information from text and screenshots.
  - type: input
    id: location
    attributes:
      label: Lesson or screen
      description: Include the title or a link. For calculator issues, include the expression and DEG/RAD setting.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List your actions and the exact control values. Use a made-up example.
      placeholder: "1. Open the lesson\n2. Set length to 4, width to 3, height to 2\n3. Choose ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: A cropped, anonymous screenshot can help.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: "For example: Firefox on a laptop, or Safari on iPad"
  - type: textarea
    id: settings
    attributes:
      label: Relevant settings or other details
      description: Include reading settings, zoom, or whether you used the hosted site or a downloaded file. Do not include personal or medical information.
